<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3498DB" />
      <stop offset="100%" stop-color="#2C3E50" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGradient)" />
  <g transform="translate(200, 150)">
    <!-- Tennis ball -->
    <circle cx="0" cy="0" r="50" fill="#FFFFFF" stroke="#2C3E50" stroke-width="2" />
    <path d="M-50,0 Q0,-50 50,0 Q0,50 -50,0" fill="none" stroke="#2C3E50" stroke-width="2" />
    <path d="M0,-50 Q50,0 0,50 Q-50,0 0,-50" fill="none" stroke="#2C3E50" stroke-width="2" />
    <!-- Tennis racket -->
    <rect x="-80" y="-10" width="100" height="20" fill="#2C3E50" />
    <ellipse cx="-80" cy="0" rx="10" ry="10" fill="#2C3E50" />
    <path d="M-20,-40 Q0,-60 20,-40 Q40,-20 20,0 Q0,20 -20,0 Q-40,-20 -20,-40" fill="#E74C3C" stroke="#2C3E50" stroke-width="2" />
  </g>
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">Learning Tennis</text>
</svg>